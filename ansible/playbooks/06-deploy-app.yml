---
# Despliega The Store en el cluster K3s.
# Tareas a implementar:
#   1. Instalar nginx-ingress (baremetal manifest oficial v1.13.1)
#      Patch: hostNetwork=true en el Deployment del controller
#             nodeSelector: cp (para que bindee 192.168.56.10:80)
#      Wait: pod ingress-nginx/controller Ready
#   2. Crear namespace "the-store"
#   3. Copiar dist/kubernetes.yaml al CP y aplicarlo:
#      kubectl apply -n the-store -f dist/kubernetes.yaml
#      (las imágenes ya apuntan a 192.168.56.1:5000 directamente en el archivo)
#   4. kubectl wait deployments --all --timeout=300s
#   5. Imprimir URL de acceso: http://192.168.56.10/
- name: Desplegar The Store en K3s
  hosts: control_plane
  become: true
  gather_facts: false
  vars:
    ingress_nginx_version: "v1.13.1"
  tasks:
    - name: Instalar nginx-ingress controller (baremetal)
      ansible.builtin.shell: >-
        kubectl apply -f
        https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-{{ ingress_nginx_version }}/deploy/static/provider/baremetal/deploy.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: true

    - name: Esperar a que el Deployment ingress-nginx-controller exista
      ansible.builtin.shell: kubectl -n ingress-nginx get deployment ingress-nginx-controller
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: ingress_deploy
      retries: 12
      delay: 5
      until: ingress_deploy.rc == 0
      changed_when: false

    - name: Parchear ingress-nginx-controller con hostNetwork=true
      ansible.builtin.shell: |
        kubectl -n ingress-nginx patch deployment ingress-nginx-controller \
          --type=json \
          -p '[{"op":"add","path":"/spec/template/spec/hostNetwork","value":true}]'
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: true

    - name: Agregar nodeSelector kubernetes.io/hostname=cp al controller
      ansible.builtin.shell: |
        kubectl -n ingress-nginx patch deployment ingress-nginx-controller \
          --type=merge \
          -p '{"spec":{"template":{"spec":{"nodeSelector":{"kubernetes.io/hostname":"cp"}}}}}'
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: true

    - name: Esperar a que el pod ingress-nginx-controller esté Ready
      ansible.builtin.shell: |
        kubectl wait pod \
          -n ingress-nginx \
          -l app.kubernetes.io/component=controller \
          --for=condition=Ready \
          --timeout=300s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    - name: Crear namespace {{ app_namespace }}
      ansible.builtin.shell: |
        kubectl get namespace {{ app_namespace }} 2>/dev/null \
          || kubectl create namespace {{ app_namespace }}
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: ns_result
      changed_when: "'created' in ns_result.stdout"

    - name: Copiar dist/kubernetes.yaml al Control Plane
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../dist/kubernetes.yaml"
        dest: /tmp/kubernetes.yaml
        mode: '0644'

    - name: Aplicar manifiesto de la aplicación
      ansible.builtin.shell: kubectl apply -n {{ app_namespace }} -f /tmp/kubernetes.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: true

    - name: Esperar a que todos los deployments estén disponibles
      ansible.builtin.shell: |
        kubectl wait deployments --all \
          -n {{ app_namespace }} \
          --for=condition=Available \
          --timeout=300s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    - name: URL de acceso a The Store
      ansible.builtin.debug:
        msg: "The Store está disponible en: http://{{ k3s_node_ip }}/"
