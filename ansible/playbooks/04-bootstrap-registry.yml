---
# Levanta un Docker Registry v2 local en el host del operador.
# Los workers hacen pull de imágenes desde esta dirección.
# Tareas principales:
#   - Verificar que Docker está corriendo
#   - Levantar container registry:2 en registry_port con restart_policy=always
#   - Health-check: registry_local_url/v2/ devuelve 200
- name: Bootstrap del Docker Registry local
  hosts: registry
  gather_facts: false
  tasks:
    - name: Verificar que Docker está corriendo
      ansible.builtin.command: docker info
      changed_when: false

    - name: Verificar estado del container registry
      ansible.builtin.shell: |
        current_port="$(docker port registry 5000/tcp 2>/dev/null | sed -n 's/.*://p' | head -n 1)"
        if [ -n "$current_port" ] && [ "$current_port" != "{{ registry_port }}" ]; then
          docker rm -f registry >/dev/null
        fi

        if docker ps -q -f name=^registry$ | grep -q .; then
          echo "running"
        elif docker ps -aq -f name=^registry$ | grep -q .; then
          docker start registry
          echo "started"
        else
          docker run -d --name registry --restart always -p {{ registry_port }}:5000 registry:2
          echo "created"
        fi
      register: registry_result
      changed_when: registry_result.stdout != 'running'

    - name: Health-check del registry
      ansible.builtin.uri:
        url: "{{ registry_local_url }}/v2/"
        status_code: 200
      register: registry_health
      retries: 5
      delay: 3
      until: registry_health.status == 200
