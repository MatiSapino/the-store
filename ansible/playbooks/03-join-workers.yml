---
- name: Unir workers al cluster K3s
  hosts: workers
  become: true
  gather_facts: true
  tasks:
    - name: Leer el node-token desde el Control Plane
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw
      delegate_to: "{{ k3s_control_plane_host }}"
      run_once: true
      no_log: true

    - name: Guardar token para el join de workers
      ansible.builtin.set_fact:
        k3s_node_token: "{{ k3s_token_raw.content | b64decode | trim }}"
      no_log: true

    - name: Verificar si k3s-agent.service ya está activo
      ansible.builtin.command: systemctl is-active k3s-agent
      register: k3s_agent_active
      changed_when: false
      failed_when: false

    - name: Detectar interfaz asociada a k3s_node_ip
      ansible.builtin.command: ip -o -4 addr show to {{ k3s_node_ip }}
      register: k3s_node_iface_query
      when: k3s_node_iface is not defined
      changed_when: false
      failed_when: k3s_node_iface_query.stdout_lines | length == 0

    - name: Guardar interfaz de red para K3s
      ansible.builtin.set_fact:
        k3s_node_iface: "{{ k3s_node_iface_query.stdout.split()[1] }}"
      when: k3s_node_iface is not defined

    - name: Descargar instalador K3s
      ansible.builtin.get_url:
        url: "{{ k3s_install_url }}"
        dest: /tmp/install-k3s.sh
        mode: '0755'
        checksum: "{{ k3s_install_checksum | default(omit) }}"
      when: k3s_agent_active.stdout != 'active'

    - name: Instalar K3s en modo agente
      ansible.builtin.command:
        argv:
          - /tmp/install-k3s.sh
          - agent
          - "--node-ip={{ k3s_node_ip }}"
          - "--node-name={{ inventory_hostname }}"
          - "--flannel-iface={{ k3s_node_iface }}"
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        K3S_URL: "https://{{ hostvars[k3s_control_plane_host].k3s_node_ip }}:6443"
        K3S_TOKEN: "{{ k3s_node_token }}"
      when: k3s_agent_active.stdout != 'active'
      changed_when: true
      no_log: true

    - name: Verificar que el nodo aparece como Ready en kubectl get nodes
      ansible.builtin.shell: >-
        kubectl get node {{ inventory_hostname }} --no-headers 2>/dev/null
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: node_status
      retries: 20
      delay: 10
      until: node_status.stdout is defined and 'Ready' in node_status.stdout
      delegate_to: "{{ k3s_control_plane_host }}"
      become: true
      changed_when: false
