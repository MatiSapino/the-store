# Tareas a implementar:
#   - apt update + instalar dependencias (curl, ca-certificates, iptables)
#   - Desactivar swap (swapoff -a + comentar /etc/fstab)
#   - Cargar módulos de kernel: br_netfilter, overlay
#   - sysctl: net.bridge.bridge-nf-call-iptables=1, net.ipv4.ip_forward=1
#   - Copiar files/registries.yaml → /etc/rancher/k3s/registries.yaml
#     (debe existir ANTES de instalar K3s para que containerd lo lea al arrancar)
#   - ufw: abrir 6443/tcp, 10250/tcp, 8472/udp si ufw está activo
- name: Preparar nodos del cluster
  hosts: cluster
  become: true
  gather_facts: true
  tasks: []
