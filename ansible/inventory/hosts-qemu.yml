---
# Inventario para macOS Apple Silicon con QEMU + socket_vmnet.
# Las VMs no son accesibles en sus IPs privadas desde el host;
# Ansible llega por localhost con los puertos SSH redirigidos.
# k3s_node_ip preserva la IP real de la VM para K3s/flannel.
all:
  children:

    cluster:
      children:
        control_plane:
          hosts:
            cp:
              ansible_host: 127.0.0.1
              ansible_port: 50010
              k3s_node_ip: 192.168.56.10
              ansible_user: vagrant
              ansible_ssh_private_key_file: ~/.vagrant.d/insecure_private_keys/vagrant.key.rsa

        workers:
          hosts:
            worker1:
              ansible_host: 127.0.0.1
              ansible_port: 50011
              k3s_node_ip: 192.168.56.11
              ansible_user: vagrant
              ansible_ssh_private_key_file: ~/.vagrant.d/insecure_private_keys/vagrant.key.rsa
            worker2:
              ansible_host: 127.0.0.1
              ansible_port: 50012
              k3s_node_ip: 192.168.56.12
              ansible_user: vagrant
              ansible_ssh_private_key_file: ~/.vagrant.d/insecure_private_keys/vagrant.key.rsa

    registry:
      hosts:
        localhost:
          ansible_connection: local
